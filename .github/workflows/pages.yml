name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar pruebas de permisos de Supabase
        run: npm install --prefix "$RUNNER_TEMP/mega-audit-tests" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Verificar conversión y auditoría interna
        env:
          NODE_PATH: ${{ runner.temp }}/mega-audit-tests/node_modules
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Preparar pruebas de navegador
        run: |
          npm install --prefix "$RUNNER_TEMP/traza-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/traza-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verificar MegaControl con documentos ficticios
        env:
          NODE_PATH: ${{ runner.temp }}/traza-browser-tools/node_modules
          TRAZA_BROWSER_OUTPUT: ${{ runner.temp }}/traza-browser-results
        run: node --test tests/traza.browser.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio
        run: |
          mkdir _site
          cp movil.html movil.css movil.js movil.webmanifest index.html traza.css traza.js megacontrol-logo.png excel-table.js audit.html audit.js audit.css audit-cloud.js audit-cloud.css audit-crypto.js supabase-config.js supabase-setup.html .nojekyll _site/
          cp -R supabase _site/
          cp -R vendor _site/
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
